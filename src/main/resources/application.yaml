server:
  port: ${CONFIG_SERVER_PORT}

spring:
  application:
    name: configserver
  profiles:
    active: git

  cloud:
    config:
      server:
        native:
          search-locations: "classpath:/config"
        git:
          uri: "https://github.com/AlbertoDeTeresaChaves/MoviesReview-config"
          default-label: master
          timeout: 5
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true