server:
  port: ${ACCOUNTS_PORT}

spring:
  datasource:
    url: jdbc:postgresql://${ACCOUNTS_DB_HOST}:${ACCOUNTS_DB_PORT}/${ACCOUNTS_DATABASE}
    username: ${ACCOUNTS_DB_USERNAME}
    password: ${ACCOUNTS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "*"
info:
  app:
    version: "0.1"